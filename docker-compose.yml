# Local infrastructure.
#
#   npm run services:up          -> Postgres + Redis only (use with `npm run dev`)
#   docker compose --profile app up --build
#                                -> the whole stack in containers, like production
name: pricetracker

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pricetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricetracker}
      POSTGRES_DB: pricetracker
    ports:
      # 5433 on the host so it doesn't clash with a natively installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricetracker -d pricetracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    # BullMQ requires noeviction, otherwise Redis may silently drop queued jobs.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Full stack (docker compose --profile app up --build) ---

  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pricetracker:${POSTGRES_PASSWORD:-pricetracker}@postgres:5432/pricetracker
      REDIS_URL: redis://redis:6379
      SERVE_WEB: "true"
      MIGRATE_ON_START: "true"
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: .
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pricetracker:${POSTGRES_PASSWORD:-pricetracker}@postgres:5432/pricetracker
      REDIS_URL: redis://redis:6379
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
