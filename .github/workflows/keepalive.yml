# Free hosting spins the site down when it's idle, and a free Supabase project
# pauses after a week of no queries. This wakes the site a few times a day,
# which also lets the price worker run its refresh sweep.
#
# Set the repository variable SITE_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to your deployed URL, e.g.
# https://price-tracker.onrender.com — without it this job does nothing.
#
# Note: GitHub disables scheduled workflows in repos with no activity for 60
# days; push a commit (or re-enable it in the Actions tab) to resume.

name: Keep alive

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL variable is not set; nothing to ping."
            exit 0
          fi
          # Free instances take ~1 minute to wake, so allow a long timeout.
          code=$(curl -sS --max-time 180 --retry 3 --retry-delay 20 \
                      -o /tmp/health.json -w '%{http_code}' "$SITE_URL/api/health") || true
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo
          [ "$code" = "200" ]
